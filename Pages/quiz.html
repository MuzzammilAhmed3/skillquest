<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillQuest | Quiz</title>
    <link rel="stylesheet" href="../Css/style.css" />
    <script src="https://kit.fontawesome.com/7c92364311.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <a href="./index.html" class="brand">
          <i class="fa-solid fa-graduation-cap brand-icon"></i>

          <div class="brand-info">
            <h2>Skill<span class="highlight">Quest</span></h2>

            <small
              >Learn<i class="fa-solid fa-circle dot"></i>Practice<i
                class="fa-solid fa-circle dot"
              ></i
              >Grow</small
            >
          </div>
        </a>

        <div class="nav-divider"></div>

        <nav class="navigation">
          <a href="../index.html" class="nav-link"
            ><i class="fa-regular fa-house nav-icon"></i>Home</a
          >

          <a href="./topics.html" class="nav-link"
            ><i class="fa-solid fa-layer-group nav-icon"></i>Topics</a
          >

          <a href="./mix-quiz.html" class="nav-link"
            ><i class="fa-solid fa-shuffle nav-icon"></i>Mix Quiz</a
          >

          <a href="./results.html" class="nav-link"
            ><i class="fa-solid fa-chart-simple nav-icon"></i>My Results</a
          >

          <a href="./settings.html" class="nav-link"
            ><i class="fa-solid fa-gear nav-icon"></i>Settings</a
          >
        </nav>

        <div class="profile">
          <div class="avatar">M</div>

          <div class="profile-info">
            <strong>Muzzammil</strong>

            <small>Beginner</small>
          </div>

          <i class="fa-solid fa-angle-down profile-dropdown-icon"></i>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content quiz-page">
        <!-- Topbar -->
        <header class="topbar">
          <div class="topbar-left">
            <a href="./topics.html">Topics</a>

            <i class="fa-solid fa-chevron-right"></i>

            <a href="./subtopics.html">Subtopics</a>

            <i class="fa-solid fa-chevron-right"></i>

            <span>Quiz</span>
          </div>

          <div class="topbar-right">
            <button aria-label="Search">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button aria-label="Notifications"><i class="fa-regular fa-bell"></i></button>

            <div class="user-info">
              <div class="user-avatar">M</div>
              <span class="username">Muzzammil</span>
              <i class="fa-solid fa-angle-down profile-dropdown-icon"></i>
            </div>
          </div>
        </header>

        <!-- Hero Section -->
        <section class="hero">
          <div class="hero-content">
            <p class="hero-eyebrow">
              <i class="fa-solid fa-bolt"></i>
              YOUR KNOWLEDGE CHALLENGE
            </p>

            <h1 class="hero-title">Let's Start Your <span>Quiz!</span></h1>

            <p class="hero-description">
              Stay focused, trust your knowledge and challenge yourself to achieve a new personal
              best.
            </p>
          </div>

          <a href="./quiz-type.html" class="quiz-exit">
            <i class="fa-solid fa-arrow-left"></i>
            Exit Quiz
          </a>
        </section>

        <section class="quiz-info-grid">
          <div class="info-card">
            <div class="info-card-icon office-icon">
              <i class="fa-brands fa-microsoft"></i>
            </div>

            <div>
              <span>Category</span>

              <h3>Microsoft</h3>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
