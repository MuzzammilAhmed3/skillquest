<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillQuest | Quiz App</title>
    <link rel="stylesheet" href="./Css/style.css" />
    <script src="https://kit.fontawesome.com/7c92364311.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <!-- LOGO -->
        <div class="logo">
          <img class="logo-icon" src="./Assets/App Logo.png" alt="App Logo" />
          <div>
            <h2>Skill<span>Quest</span></h2>
            <p>Learn Practice Grow</p>
          </div>
        </div>

        <button id="menuToggle" class="menu"><i class="fa-solid fa-bars"></i> Menu</button>

        <!-- NAVLINKS -->
        <nav class="nav-links">
          <button class="nav-link active">
            <span class="nav-icon"><i class="fa-regular fa-house"></i></span>Home
          </button>

          <button class="nav-link">
            <span class="nav-icon"><i class="fa-solid fa-kaaba"></i> </span>Topics
          </button>

          <button class="nav-link">
            <span class="nav-icon"><i class="fa-solid fa-shuffle"></i></span>Mix Quiz
          </button>

          <button class="nav-link">
            <span class="nav-icon"><i class="fa-solid fa-chart-simple"></i></span>My Results
          </button>

          <button class="nav-link">
            <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>Settings
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="user-card">
            <p class="avatar"><i class="fa-solid fa-user"></i></p>
            <div class="user-info">
              <p class="user-name">Muzzammil</p>
              <p class="user-level">Beginner</p>
            </div>
          </div>
          <i class="fa-solid fa-angle-down"></i>
        </div>
      </div>

      <main class="main">
        <!-- HEADER -->
        <header class="topbar">
          <i class="fa-solid fa-magnifying-glass right-brd"></i>
          <i class="fa-regular fa-bell right-brd"></i>
          <div class="user-card">
            <p class="avatar"><i class="fa-solid fa-user"></i></p>
            <div class="user-info">
              <p class="user-name">Muzzammil</p>
            </div>
            <i class="fa-solid fa-angle-down"></i>
          </div>
        </header>

        <!-- HOME -->
        <section id="home" class="page active">
          <div class="welcome">
            <h1 class="title">Welcome to <span class="highlight">SkillQuest</span></h1>
            <p class="sub-title">
              Sharpen your skills with quizzes on MS Office, Frontend, Backend, Databases and
              more! Choose a topic, select a quiz type and start learning today.
            </p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
